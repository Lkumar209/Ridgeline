# Runs the same gate as local development: `make check` (ruff, mypy --strict, pytest).
# Fully offline by design: tests use committed fixtures under data/fixtures and tests/fixtures,
# never data/cache, the network, or API keys. Tests that need the network must be marked
# `network`; `make test` excludes them.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: make check
        run: make check
