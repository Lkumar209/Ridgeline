# Every number that describes the world lives here, never inline in code.
# Each entry needs: value, unit, source (a URL, or the literal "ASSUMPTION"), notes.
# A test (tests/unit/test_assumptions.py) fails if any entry is missing a source or label.
#
# All outputs of this project are ILLUSTRATIVE. Values labeled ASSUMPTION are placeholders
# chosen for plausibility, not facts.

battery_power_kw:
  value: 125
  unit: kW
  source: ASSUMPTION
  notes: Default size from the project brief. Configurable per run.

battery_energy_kwh:
  value: 250
  unit: kWh
  source: ASSUMPTION
  notes: Default size from the project brief (2-hour duration). Configurable per run.

battery_round_trip_efficiency:
  value: 0.88
  unit: fraction (AC-AC)
  source: ASSUMPTION
  notes: Placeholder typical of lithium-ion commercial systems; varied in M4 Monte Carlo.

battery_soc_min:
  value: 0.05
  unit: fraction of energy capacity
  source: ASSUMPTION
  notes: Reserve to avoid deep discharge. Placeholder.

battery_soc_max:
  value: 0.95
  unit: fraction of energy capacity
  source: ASSUMPTION
  notes: Headroom at the top of charge. Placeholder.

power_factor_for_kva_demand:
  value: 0.90
  unit: fraction (kW / kVA)
  source: ASSUMPTION
  notes: >-
    Used only to convert $/kVA demand charges to $/kW (rate / PF). ComStock gives real power
    only, so a site's actual power factor is unknown. Placeholder for typical commercial loads.

billing_demand_basis:
  value: highest 15-min average kW in the billing month
  unit: definition
  source: ASSUMPTION
  notes: >-
    Simplification. Per the project owner's reading of the MECo G-2 tariff, billing demand has a
    kVA-based clause above 75 kW. ComStock gives real power only, so we bill on kW. Where a URDB
    record states demand in kVA, the loader converts $/kVA with power_factor_for_kva_demand instead.

bill_scope_delivery_only:
  value: delivery charges only; supply (basic service) energy excluded
  unit: scope
  source: ASSUMPTION
  notes: >-
    The MECo G-2 URDB record covers delivery service only (per the project owner). Supply costs
    are excluded from bills, so battery round-trip losses and any energy arbitrage are
    under-valued. Demand-charge savings, the main value stream here, are unaffected.

meco_g2_urdb_record:
  value: 67d08dea7568c8189f03c54e (approved = false in URDB)
  unit: URDB rate id
  source: https://apps.openei.org/USURDB/rate/view/67d08dea7568c8189f03c54e
  notes: >-
    Massachusetts Electric Co (EIA 11804) G-2 Demand, SEMA load zone, effective 2025-02-01.
    The project owner reports $14.82/kW flat monthly demand, max 200 kW, min 10,000 kWh/month,
    source document meco_g2.pdf from National Grid. The record is marked approved = false in
    URDB. URL built from the rate id; the JSON is not yet committed, so all of this is unverified
    until data/tariffs/meco_g2_sema.json is added and parsed.

comstock_load_data:
  value: ComStock 2024 release 2, AMY2018, upgrade 0 (baseline)
  unit: dataset
  source: https://oedi-data-lake.s3.amazonaws.com/nrel-pds-building-stock/end-use-load-profiles-for-us-building-stock/2024/comstock_amy2018_release_2/data_dictionary.tsv
  notes: >-
    Modeled (EnergyPlus) buildings, not metered sites. Timestamps are local standard time
    (UTC-5) and interval-ending; verified empirically in M1 (see DECISIONS.md ADR-003).
