[project]
name = "ridgeline"
version = "0.1.0"
description = "Rank Massachusetts commercial sites for behind-the-meter battery peak shaving, by robustness under uncertainty. Illustrative only."
authors = [
    { name = "Laxya Kumar", email = "112336121+Lkumar209@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ridgeline = "ridgeline.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.17.1.5",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Tests use fixtures and hypothesis strategies; keep strict typing on the package itself.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: needs internet access (skipped by default in make check)"]
filterwarnings = [
    # Third-party: starlette's TestClient warns about its own httpx dependency. Not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as default-argument calls by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
