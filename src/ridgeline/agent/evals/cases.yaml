    npv_p10: -254777.09572197462
    npv_p50: -210996.93771232956
    npv_p90: -175015.62621028378
    p_npv_positive: 0.0
    breakeven_capex_usd_per_kw: -402.5332245670929
    required_other_revenue_usd_per_kw_year: 161.5629902944257
    top_site_by_p10: cs-70654
    top_site_by_p50: cs-130562
  expected_mentions:
