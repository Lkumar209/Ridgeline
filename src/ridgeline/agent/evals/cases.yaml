  mock_response: 'Site cs-118913, a strip mall on the G-3 time-of-use rate, sits in the middle of the
    40 sites: 20th by bad-case (P10) NPV and 19th by median (P50) NPV. It loses about $245k in a bad-case
    future and about $200k in a typical one over 15 years, and none of the 8,000 simulated futures came
